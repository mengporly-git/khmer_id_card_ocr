name: khmer_id_card_ocr
description: Offline Khmer and Latin text recognition for Cambodian national ID cards.
version: 0.1.1
repository: https://github.com/mengporly-git/khmer_id_card_ocr

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/tessdata/
    - assets/recognition/
  plugin:
    platforms:
      android:
        package: dev.khmerocr.khmer_id_card_ocr
        pluginClass: KhmerIdCardOcrPlugin
      ios:
        pluginClass: KhmerIdCardOcrPlugin
