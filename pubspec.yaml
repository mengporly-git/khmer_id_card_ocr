name: khmer_id_card_ocr
description: Offline Khmer and Latin text recognition for Cambodian national ID cards.
version: 0.2.0
repository: https://github.com/mengporly-git/khmer_id_card_ocr

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  image: ^4.13.1
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/tessdata/
    - assets/recognition/
  plugin:
    platforms:
      android:
        package: dev.khmerocr.khmer_id_card_ocr
        pluginClass: KhmerIdCardOcrPlugin
      ios:
        pluginClass: KhmerIdCardOcrPlugin
